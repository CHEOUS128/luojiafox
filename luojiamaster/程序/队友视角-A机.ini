# ============================================================
#  队友视角 · A 机（可选，不是必需）
#
#  【默认就已经启用】双击 luojiamaster.exe，右侧就会出现队友小窗：
#      默认 A 机 = 找 10.77.0.2:47700
#      B 机      = 找 10.77.0.1:47700
#  切角色不用改文件：在队友小窗标题条上点一下 [默认A] 这个标签，
#  变成 [B] 就切过去了。选择会自动写回 exe 旁边的 队友视角.ini。
#
#  本文件什么时候才需要？
#    1. 想把本机永久固定成 A 机 → 把本文件复制一份、改名成 队友视角.ini
#    2. 队友网不是 10.77.0.x（比如同一台电脑开两个实例）→ 在 队友视角.ini 里写 peer=
#    3. 暂时不想要这个功能 → 在 队友视角.ini 里写 peer=off
#
#  两台机器的 IP 约定（专用队友网线，10.77.0.x）：
#      A 机这块网卡 = 10.77.0.1
#      B 机这块网卡 = 10.77.0.2
#  所以 A 机找对方（10.77.0.2）。listen 两端都是 47700。
#
#  优先级：命令行 --teammate-*  >  队友视角.ini 里的 peer=  >  下面的 role=
#  命令行参数只用于本机双实例测试（启动-本地测试-A.bat / -B.bat）。
# ============================================================

# 本机角色。A = 找 10.77.0.2，B = 找 10.77.0.1
role=A


# 想改对方 IP 时取消下面这行的注释（写了 peer= 就以它为准，不再跟角色走）
# peer=10.77.0.2:47700

# 在本机哪个端口收对方发来的画面；两端都填 47700
listen=47700
