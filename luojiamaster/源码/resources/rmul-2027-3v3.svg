<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
<title id="title">2027 高校联盟赛 3V3 场地简图</title>
<desc id="desc">围挡内沿 12 米 × 8 米，原点为规则图左上，图中一个单位代表 10 毫米。红方左上、蓝方右下。轮廓按联盟赛规则 V1.0.0 图3-5描绘，名称与层级核对图3-4、3-9、3-10。虚线框仅标隧道位置，不代表通道边界。</desc>
<style>
text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;text-anchor:middle;fill:#263a41}
.name{font-size:31px;font-weight:bold}.minor{font-size:24px}.small{font-size:20px}.lift{fill:#c7d2d2;stroke:#7a9396;stroke-width:2}.control{fill:#deebe4;stroke:#538a74;stroke-width:3}.guide{fill:none;stroke:#4e6574;stroke-width:2.5;stroke-dasharray:8 5}
</style>
