#####-----视频发送（第二视角）-----#####
# 工业相机画面 → H.264 → 0x0310 → 下位机 → 图传 → 客户端 H 键切换
#
# 2026-10-23 改版：链路实测通过率只有 0.16%~0.64%，一个「要好几个包才能拼完」的大帧
# 几乎不可能完整到达。现在改成 **一帧 = 一个包**：每帧独立编码（全 I 帧），
# 整帧硬性限制在 296 字节以内，超了就整帧丢掉（绝不拆包）。
# 这样任何一个包单独到达，客户端都能解出一张完整的图 → 先保证"能看到画面"。
#
# 想回到原来的全视野 300x240：把最后三行换成 300/240/1.0/10.0/90.0/10/0.6，
# 并把 video_single_packet 改成 false。
video_send_enable: true       # 完整功能：图传开启
# 2026-10-24 夜：像素面积 ×9（160² → 480²）
# 依据：同一场抓包显示每帧 231B 中位、296B 上限，而通道整包到达率只有 8.4%；
# 官方图传 724 包/秒全通。⇒ 瓶颈是「包能不能过」，不是「帧多大」。
# 编码器 VBV 会把每帧压到 max_frame_bytes 以内；真压不进去就整帧丢弃，
# 日志里会写「超限丢弃」，绝不会把一个帧拆成半帧发出去。
# 480 = 30 个 16×16 宏块；crop 也是 480 ⇒ 画面是原图 1:1 中心区，不走缩放。
video_width: 480
video_height: 480
video_keep_aspect: false      # false=从原图中心裁 crop_size×crop_size 再缩到上面的大小
video_fps: 5.0                # 只发 5 帧/秒：链路丢得厉害，少发一点提高每帧到达率。
                              # 嫌 5fps 卡可以改 10.0 + bitrate 20（实测 160x160 每帧约 234B 也塞得下）
video_bitrate_kbps: 10        # 每帧上限的参考值；写 0 = 自动按 max_frame_bytes×帧率×0.85 算
video_crop_size: 480          # 从 1280x1024 中心裁 480x480 = 原图 1:1（不再缩小），面积是 320² 的 2.25 倍
video_x264_preset: "slow"     # 编码在独立线程，不阻塞主循环；160x160 一帧只要几 ms
video_sharpen: 0.0            # 单包模式下不要锐化：锐化会加高频细节、把帧撑大
video_send_rate_hz: 40.0      # 出包节拍（包/秒），协议上限 50。5fps 时实际只用 5 包/秒
video_single_packet: true     # ★一帧一个包：超 296 字节的帧直接丢，不拆包
video_max_frame_bytes: 296    # 一帧 H.264 的硬上限 = 300 - 2B长度 - 2B序号
